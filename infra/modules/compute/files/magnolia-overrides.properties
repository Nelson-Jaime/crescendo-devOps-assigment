
# --- managed by Terraform (modules/compute/files/magnolia-overrides.properties) ---
# Keep the repository, logs and caches outside the webapp so a redeploy keeps the content.
magnolia.repositories.home=/var/lib/magnolia/repositories
magnolia.logs.dir=/var/log/magnolia
magnolia.cache.startdir=/var/lib/magnolia/cache
magnolia.upload.tmpdir=/var/lib/magnolia/tmp/uploads
# Install and update modules automatically on startup. Without this Magnolia waits for someone to click
# "Start installation" at /.magnolia/installer, which Nginx blocks (ADR 0010), so the site would never come up.
magnolia.update.auto=true
