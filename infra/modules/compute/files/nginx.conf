user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    server_tokens off;

    # Trust the scheme CloudFront reports (the ALB leg is plain HTTP); fall back to the local scheme.
    map $http_cloudfront_forwarded_proto $forwarded_proto {
        default $scheme;
        "~^https?$" $http_cloudfront_forwarded_proto;
    }

    log_format main '$remote_addr "$http_x_forwarded_for" [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream tomcat {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Admin interface rule (blocked by default, see ADR 0010).
        include /etc/nginx/magnolia-admin.conf;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://tomcat;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
